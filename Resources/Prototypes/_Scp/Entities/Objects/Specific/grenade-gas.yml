- type: entity
  id: AdminInstantEffectFlameSmoke10
  categories: [ HideSpawnMenu ]
  parent: AdminInstantEffectBase
  components:
  - type: SmokeOnTrigger
    duration: 10
    spreadAmount: 60
    solution:
      reagents:
      - ReagentId: PolytrinicAcid
        Quantity: 30
      - ReagentId: Napalm
        Quantity: 60
      - ReagentId: Phlogiston
        Quantity: 10
  - type: EmitSoundOnTrigger
    sound: /Audio/Effects/smoke.ogg
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/Smoke-grenade.ogg

