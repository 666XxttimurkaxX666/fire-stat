- type: entity
  id: CameraInstant
  parent: BaseItem
  name: instant camera
  components:
  - type: Sprite
    sprite: _Scp/Objects/Research/camera.rsi
    state: icon
  - type: ScpInteractTool
    delay: 2
    cooldown: 600 # 5 минут
    cooldownMessage: scp-interact-time-left
    event: !type:ScpSpawnInteractDoAfterEvent
      toSpawn: Scp096PhotoDeveloped
    sound: /Audio/Machines/machine_switch.ogg
    whitelist:
      components:
      - Scp096
  - type: GuideHelp
    guides:
    - ScpResearchAdvanced

- type: entity
  parent: BaseItem
  id: ScpBasePortableSurveillanceCameraMonitor
  name: ScpBasePortableSurveillanceCameraMonitor
  components:
  - type: SurveillanceCameraMonitor
  - type: Sprite
    sprite: _Scp/Objects/Tools/scp_monitor.rsi
    state: icon
  - type: ActivatableUI
    key: enum.SurveillanceCameraMonitorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraMonitorUiKey.Key:
        type: SurveillanceCameraMonitorBoundUserInterface
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: SurveillanceCamera
    transmitFrequencyId: SurveillanceCamera
  - type: WiredNetworkConnection
  - type: Appearance

