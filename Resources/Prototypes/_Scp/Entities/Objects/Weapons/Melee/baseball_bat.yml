- type: entity
  parent: BaseBallBat
  id: ScpBaseBallBat
  components:
  - type: Sprite
    sprite: _Scp/Objects/Weapons/Melee/baseball_bat.rsi
    state: icon
  - type: Item
    storedSprite:
      state: storage
      sprite: _Scp/Objects/Weapons/Melee/baseball_bat.rsi
  - type: Construction
    graph: ScpWoodenBat
    node: bat

- type: entity
  parent: IncompleteBaseBallBat
  id: ScpIncompleteBaseBallBat
  components:
  - type: Sprite
    sprite: _Scp/Objects/Weapons/Melee/incomplete_bat.rsi
    state: icon
  - type: Item
    sprite: _Scp/Objects/Weapons/Melee/incomplete_bat.rsi
    storedSprite:
      state: storage
      sprite: _Scp/Objects/Weapons/Melee/incomplete_bat.rsi
  - type: Construction
    graph: ScpWoodenBat
    node: incompleteBat

- type: entity
  parent: BaseBallBat
  id: ScpNailBaseBallBat
  components:
  - type: Sprite
    sprite: _Scp/Objects/Weapons/Melee/nail_baseball_bat.rsi
    state: icon
  - type: Item
    storedSprite:
      state: storage
      sprite: _Scp/Objects/Weapons/Melee/nail_baseball_bat.rsi
  - type: Construction
    graph: ScpWoodenBat
    node: nailBat
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 5
        Structural: 5
        Piercing: 5
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
        Structural: 5
        Piercing: 5
