#-----------------КОМАНДИР
- type: entity
  parent: MobHumanChaos
  suffix: CHAOS | ANTAG
  id: MobHumanChaosLeader
  components:
  - type: GhostRole
    name: ghost-role-information-chaos-leader-name
    description: ghost-role-information-chaos-leader-description
    rules: ghost-role-information-chaos-leader-rules
    raffle:
      settings: short
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
  - type: RandomMetadata
    nameSegments:
    - NamesChaosLeader
    - LastNamesChaos
    nameFormat: name-format-ert
  - type: Loadout
    prototypes: [ ChaosLeaderGear ]
    roleLoadout: [ RoleSurvivalNukie ]


#-----------------МЕДИК
- type: entity
  parent: MobHumanChaos
  suffix: CHAOS | ANTAG
  id: MobHumanChaosMedic
  components:
  - type: GhostRole
    name: ghost-role-information-chaos-medic-name
    description: ghost-role-information-chaos-medic-description
    rules: ghost-role-information-chaos-rules
    raffle:
      settings: short
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
  - type: RandomMetadata
    nameSegments:
    - NamesChaosMedic
    - LastNamesChaos
    nameFormat: name-format-ert
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [ ChaosMedicGear ]


#-----------------ВОИН
- type: entity
  parent: MobHuman
  suffix: CHAOS | ANTAG
  id: MobHumanChaos
  components:
  - type: CustomBriefing
    briefingText: chaos-raider-welcome-neutral
    briefingSound:
      path: /Audio/_Scp/Themes/The_Chaos_Insurgency_Theme.ogg
  - type: GhostRole
    name: ghost-role-information-chaos-name
    description: ghost-role-information-chaos-description
    rules: ghost-role-information-chaos-rules
    raffle:
      settings: short
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
  - type: GhostTakeoverAvailable
  - type: NpcFactionMember
    factions:
    - Chaos
  - type: Loadout
    prototypes: [ ChaosGear ]
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: ZombieImmune
  - type: Scp049Protection
  - type: RandomMetadata
    nameSegments:
    - NamesChaos
    - LastNamesChaos
    nameFormat: name-format-ert
