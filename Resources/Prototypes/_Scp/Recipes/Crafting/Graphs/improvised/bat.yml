- type: constructionGraph
  id: ScpWoodenBat
  start: start
  graph:
    - node: start
      edges:
        - to: incompleteBat
          steps:
            - material: WoodPlank
              amount: 5
              doAfter: 4

    - node: incompleteBat
      entity: ScpIncompleteBaseBallBat
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: ScpMaterialWoodPlank1
              amount: 5
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 1
        - to: bat
          steps:
            - tool: Slicing
              doAfter: 4

    - node: bat
      entity: ScpBaseBallBat
      edges:
        - to: nailBat
          steps:
            - material: MetalRod
              amount: 3
              doAfter: 2

    - node: nailBat
      entity: ScpNailBaseBallBat
      edges:
        - to: bat
          completed:
            - !type:SpawnPrototype
              prototype: PartRodMetal1
              amount: 3
          steps:
            - tool: Prying
              doAfter: 2
