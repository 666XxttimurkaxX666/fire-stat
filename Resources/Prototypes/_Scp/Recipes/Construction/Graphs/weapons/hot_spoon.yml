- type: constructionGraph
  id: HotSpoon
  start: start
  graph:

  - node: start
    entity: SpoonPlastic
    edges:
    - to: hot spoon
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 345

  - node: hot spoon
    entity: ScpBaseHotSpoon
    edges:
    - to: hot cloth spoon
      steps:
      - material: Cloth
        amount: 1
        doAfter: 1

  - node: hot cloth spoon
    entity: ScpHotClothSpoon
