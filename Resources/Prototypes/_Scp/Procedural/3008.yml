- type: dungeonRoomPack
  id: IkeaRoomsPack23x5
  size: 23,5
  rooms:
    - 0,0,23,5

- type: entity
  parent: ScpWallConcreteLightContainment
  id: Scp3008Wall
  categories: [HideSpawnMenu]
  components:
  - type: RCDDeconstructable
    cost: 666
    delay: 666
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 999999
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

