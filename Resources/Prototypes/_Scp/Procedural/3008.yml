- type: dungeonConfig
  id: 3008Base
  layers:
  - !type:PrefabDunGen
    presets:
    - IkeaRooms
    fallbackTile: ScpFloorSteel
    roomWhitelist:
      tags:
      - IkeaRooms

#  - !type:CorridorDunGen
#    width: 10
#    tile: ScpFloorSteel

  - !type:WormCorridorDunGen
    width: 15
    tile: ScpFloorSteel
    maxAngleChange: 0
    count: 1
    length: 10

  - !type:RoomEntranceDunGen
    tile: ScpFloorSteel
    contents: 3008Entrance

  - !type:WallMountDunGen
    contents: 3008Walls
    tile: ScpFloorSteel

  - !type:BoundaryWallDunGen
    wall: Scp3008Wall
    cornerWall: Scp3008Wall
    tile: ScpFloorSteel

  - !type:AutoCablingDunGen
    entity: CableApcExtension

  - !type:CorridorDecalSkirtingDunGen
    cardinalDecals:
      South: BrickTileWhiteLineS
      East: BrickTileWhiteLineE
      North: BrickTileWhiteLineN
      West: BrickTileWhiteLineW
    cornerDecals:
      SouthEast: BrickTileWhiteCornerSe
      SouthWest: BrickTileWhiteCornerSw
      NorthEast: BrickTileWhiteCornerNe
      NorthWest: BrickTileWhiteCornerNw
    pocketDecals:
      SouthWest: BrickTileWhiteInnerSw
      SouthEast: BrickTileWhiteInnerSe
      NorthWest: BrickTileWhiteInnerNw
      NorthEast: BrickTileWhiteInnerNe

  - !type:EntranceFlankDunGen
    tile: ScpFloorSteel
    contents: 3008WallsLights

  - !type:CorridorClutterDunGen
    contents: 3008CorridorLights
    chance: 0.01

  - !type:CorridorClutterDunGen
    contents: 3008CorridorEntities2
    chance: 0.001

  - !type:CorridorClutterDunGen
    contents: 3008CorridorEntities
    chance: 0.005

  - !type:MobsDunGen
    minCount: 150
    maxCount: 180
    contents: 3008Mobs

