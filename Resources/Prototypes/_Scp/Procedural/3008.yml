- type: entity
  parent: ScpWallConcreteLightContainment
  id: Scp3008Wall
  category: [HideSpawnMenu]
  components:
  - type: RCDDeconstructable
    cost: 666
    delay: 666
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 999999
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entityTable
  id: 3008CorridorEntities
  table: !type:GroupSelector
    children:
    - id: Scp3008MusicBox
      amount: 1

- type: entityTable
  id: 3008Entrance
  table: !type:GroupSelector
    children:
    - id: CableApcExtension
      amount: 1
    - id: ScpWoodDoor
      amount: 1
    - id: ScpMetalDoor
      amount: 1
    - id: ScpAirlockLogotype
      amount: 1

- type: entityTable
  id: 3008Walls
  table: !type:GroupSelector
    children:
    - id: ExtinguisherCabinetFilled
      amount: 1
      prob: 0.05

- type: entityTable
  id: 3008Mobs
  table: !type:GroupSelector
    children:
    - id: BasicScp3008
      amount: 1
    - id: StrongScp3008
      amount: 1
    - id: TallScp3008
      amount: 1

- type: dungeonConfig
  id: 3008Base
  layers:
  - !type:PrefabDunGen
    presets:
    - IkeaRooms
    fallbackTile: ScpFloorSteel
    roomWhitelist:
      tags:
      - IkeaRooms

#  - !type:CorridorDunGen
#    width: 10
#    tile: ScpFloorSteel

  - !type:WormCorridorDunGen
    width: 10
    tile: ScpFloorSteel
    maxAngleChange: 0
    count: 1
    length: 10

  - !type:RoomEntranceDunGen
    tile: ScpFloorSteel
    contents: 3008Entrance

  - !type:WallMountDunGen
    contents: 3008Walls
    tile: ScpFloorSteel

  - !type:BoundaryWallDunGen
    wall: Scp3008Wall
    cornerWall: Scp3008Wall
    tile: ScpFloorSteel

  - !type:JunctionDunGen
    width: 2
    tile: ScpFloorSteel
    contents: BaseAirlockScp

  - !type:AutoCablingDunGen
    entity: CableApcExtension

  - !type:CornerClutterDunGen
    contents: BaseClutter

  - !type:CorridorClutterDunGen
    contents: 3008CorridorEntities
    chance: 0.001

  - !type:MobsDunGen
    minCount: 40
    maxCount: 60
    contents: 3008Mobs

  - !type:PrototypeDunGen
    proto: VGRoidFill
    inheritDungeons: All
  # Ores
  - !type:OreDunGen
    replacement: IronRock
    entity: SunriseVGRoidIronRockIronCrabChance # Sunrise-edit
    count: 30 # Sunrise-edit
    minGroupSize: 10
    maxGroupSize: 15

  # TODO: Add Mobs/Items.
  # For items -> LimitedEntityDunGen
  # For mobs -> MobsDunGen

- type: dungeonConfig
  id: 3008
  layers:
  - !type:PrototypeDunGen
    proto: 3008Base
